<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ampel-Router</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0d;
      --panel:     #141414;
      --border:    #2a2a2a;
      --accent:    #c8f135;
      --red:       #ff4545;
      --text:      #e8e8e8;
      --muted:     #666;
      --radius:    10px;
    }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── PANEL ── */
    #panel {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--accent);
      flex: 1;
    }

    /* ── INPUTS ── */
    .field {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .field-label {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      width: 28px;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px 11px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }

    /* ── AUTOCOMPLETE ── */
    .field { position: relative; }

    .ac-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 34px;
      right: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      z-index: 1000;
      overflow: hidden;
      display: none;
    }

    .ac-dropdown.open { display: block; }

    .ac-item {
      padding: 8px 11px;
      font-size: 0.8rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s;
    }

    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover, .ac-item.focused { background: #1f1f1f; color: var(--accent); }

    #gps-btn {
      padding: 7px 11px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--accent);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    #gps-btn:hover { background: var(--accent); color: var(--bg); }

    /* ── OPTION ROWS ── */
    .options-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 5px 13px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .chip:hover { border-color: var(--text); color: var(--text); }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      font-weight: 500;
    }

    .chip.active.red {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    /* ── ROUTE BUTTON ── */
    #route-btn {
      padding: 9px;
      width: 100%;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    #route-btn:hover { opacity: 0.88; }
    #route-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── STATUS ── */
    #status {
      font-size: 0.72rem;
      color: var(--muted);
      min-height: 15px;
      text-align: center;
    }

    #status.error { color: var(--red); }
    #status.ok    { color: var(--accent); }

    /* ── MAP ── */
    #map { flex: 1; }

    /* ── LEAFLET OVERRIDES ── */
    .leaflet-popup-content-wrapper {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: none;
    }

    .leaflet-popup-tip { background: var(--panel); }
  </style>
</head>
<body>

<div id="panel">
  <div class="panel-top">
    <h1>🚦 Ampel-Router</h1>
  </div>

  <div class="field">
    <span class="field-label">Von</span>
    <input type="text" id="start-input" placeholder="Startadresse..." autocomplete="off" />
    <button id="gps-btn" onclick="useGPS()" title="GPS nutzen">📍</button>
    <div class="ac-dropdown" id="start-ac"></div>
  </div>

  <div class="field">
    <span class="field-label">Nach</span>
    <input type="text" id="end-input" placeholder="Zieladresse..." autocomplete="off" />
    <div class="ac-dropdown" id="end-ac"></div>
  </div>

  <div class="options-row" id="mode-options">
    <button class="chip active" data-value="bike" onclick="setOption('mode', this)">🚴 Fahrrad</button>
    <button class="chip" data-value="foot" onclick="setOption('mode', this)">🏃 Joggen</button>
    <button class="chip" data-value="car" onclick="setOption('mode', this)">🚗 Auto</button>
  </div>

  <div class="options-row" id="avoid-options">
    <button class="chip active" data-value="minimize" onclick="setOption('avoid', this)">🟡 Minimieren</button>
    <button class="chip red" data-value="avoid" onclick="setOption('avoid', this)">🔴 Komplett vermeiden</button>
  </div>

  <button id="route-btn" onclick="getRoute()">Route berechnen</button>
  <div id="status"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ─────────────────────────────────────────
//  ⚙️  OpenRouteService API KEY
//  Kostenlos: https://openrouteservice.org/sign-up/
// ─────────────────────────────────────────
const API_KEY = 'ORS_KEY_HIER';
// ─────────────────────────────────────────

const ORS = 'https://api.openrouteservice.org';

const map = L.map('map', { zoomControl: true }).setView([52.3676, 4.9041], 13);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO',
  maxZoom: 19
}).addTo(map);

let mode      = 'bike';
let avoidMode = 'minimize';
let gpsCoords = null;
let routeLayer = null;
let markerGroup = L.layerGroup().addTo(map);

// ── Option toggles ──
function setOption(group, btn) {
  const container = group === 'mode' ? '#mode-options' : '#avoid-options';
  document.querySelectorAll(container + ' .chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (group === 'mode')  mode      = btn.dataset.value;
  if (group === 'avoid') avoidMode = btn.dataset.value;
}

// ── Status ──
function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = type;
}

// ── GPS ──
function useGPS() {
  setStatus('GPS wird abgerufen…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      gpsCoords = [pos.coords.latitude, pos.coords.longitude];
      document.getElementById('start-input').value = `📍 ${gpsCoords[0].toFixed(5)}, ${gpsCoords[1].toFixed(5)}`;
      setStatus('Standort gesetzt.', 'ok');
    },
    err => setStatus('GPS-Fehler: ' + err.message, 'error')
  );
}

// ── Geocoding ──
async function geocode(query) {
  const url = `${ORS}/geocode/search?api_key=${API_KEY}&text=${encodeURIComponent(query)}&size=1&lang=de`;
  const res  = await fetch(url);
  const data = await res.json();
  if (!data.features?.length) throw new Error(`Adresse nicht gefunden: "${query}"`);
  const [lng, lat] = data.features[0].geometry.coordinates;
  return [lat, lng];
}

// ── Autocomplete ──
const acState = {
  'start-input': { dropdown: null, coords: null, timer: null, focusIdx: -1 },
  'end-input':   { dropdown: null, coords: null, timer: null, focusIdx: -1 }
};

function initAC(inputId, dropdownId) {
  const input = document.getElementById(inputId);
  const drop  = document.getElementById(dropdownId);
  acState[inputId].dropdown = drop;

  input.addEventListener('input', () => {
    const s = acState[inputId];
    s.coords = null;
    clearTimeout(s.timer);
    const q = input.value.trim();
    if (q.length < 3) { closeDrop(drop); return; }
    s.timer = setTimeout(() => fetchSuggestions(inputId, q), 300);
  });

  input.addEventListener('keydown', e => {
    const s = acState[inputId];
    const items = drop.querySelectorAll('.ac-item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      s.focusIdx = Math.min(s.focusIdx + 1, items.length - 1);
      updateFocus(items, s.focusIdx);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      s.focusIdx = Math.max(s.focusIdx - 1, 0);
      updateFocus(items, s.focusIdx);
    } else if (e.key === 'Enter' && s.focusIdx >= 0) {
      e.stopPropagation();
      items[s.focusIdx].click();
    } else if (e.key === 'Escape') {
      closeDrop(drop);
    }
  });

  document.addEventListener('click', e => {
    if (!input.contains(e.target) && !drop.contains(e.target)) closeDrop(drop);
  });
}

function updateFocus(items, idx) {
  items.forEach((el, i) => el.classList.toggle('focused', i === idx));
}

function closeDrop(drop) {
  drop.classList.remove('open');
  drop.innerHTML = '';
}

async function fetchSuggestions(inputId, query) {
  try {
    const url  = `${ORS}/geocode/autocomplete?api_key=${API_KEY}&text=${encodeURIComponent(query)}&size=5&lang=de`;
    const res  = await fetch(url);
    const data = await res.json();
    renderSuggestions(inputId, data.features || []);
  } catch { /* silently ignore */ }
}

function renderSuggestions(inputId, features) {
  const input = document.getElementById(inputId);
  const s     = acState[inputId];
  const drop  = s.dropdown;
  s.focusIdx  = -1;
  drop.innerHTML = '';

  if (!features.length) { closeDrop(drop); return; }

  features.forEach(f => {
    const p     = f.properties;
    const label = p.label || p.name || '';
    const item  = document.createElement('div');
    item.className   = 'ac-item';
    item.textContent = label;
    item.addEventListener('mousedown', e => e.preventDefault());
    item.addEventListener('click', () => {
      input.value = label;
      const [lng, lat] = f.geometry.coordinates;
      s.coords = [lat, lng];
      closeDrop(drop);
    });
    drop.appendChild(item);
  });

  drop.classList.add('open');
}

initAC('start-input', 'start-ac');
initAC('end-input',   'end-ac');

// ── Profil-Auswahl ──
// cycling-safe meidet Hauptstraßen/Ampeln stark
function getProfile() {
  if (mode === 'bike') return avoidMode === 'avoid' ? 'cycling-safe' : 'cycling-regular';
  if (mode === 'foot') return 'foot-walking';
  return 'driving-car';
}

// ── Haupt-Routing ──
async function getRoute() {
  const startVal = document.getElementById('start-input').value.trim();
  const endVal   = document.getElementById('end-input').value.trim();

  if (!startVal || !endVal) {
    setStatus('Bitte Start und Ziel eingeben.', 'error');
    return;
  }

  const btn = document.getElementById('route-btn');
  btn.disabled = true;
  setStatus('Route wird berechnet…');

  try {
    let from;
    if (gpsCoords && startVal.startsWith('📍')) {
      from = gpsCoords;
    } else if (acState['start-input'].coords) {
      from = acState['start-input'].coords;
    } else {
      from = await geocode(startVal);
    }

    const to = acState['end-input'].coords || await geocode(endVal);

    const profile = getProfile();
    const res = await fetch(`${ORS}/v2/directions/${profile}/geojson`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': API_KEY
      },
      body: JSON.stringify({
        coordinates: [[from[1], from[0]], [to[1], to[0]]]
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || `API-Fehler ${res.status}`);

    const feature  = data.features[0];
    const latlngs  = feature.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
    const summary  = feature.properties.summary;

    if (routeLayer) map.removeLayer(routeLayer);
    markerGroup.clearLayers();

    routeLayer = L.polyline(latlngs, {
      color: '#c8f135',
      weight: 5,
      opacity: 0.9,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    const iconStyle = (label, color) => L.divIcon({
      html: `<div style="background:${color};color:#0d0d0d;font-family:Syne,sans-serif;font-weight:800;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">${label}</div>`,
      className: '',
      iconAnchor: [0, 10]
    });

    L.marker(from, { icon: iconStyle('START', '#c8f135') }).addTo(markerGroup);
    L.marker(to,   { icon: iconStyle('ZIEL',  '#ff4545') }).addTo(markerGroup);

    map.fitBounds(routeLayer.getBounds(), { padding: [24, 24] });

    const km  = (summary.distance / 1000).toFixed(1);
    const min = Math.round(summary.duration / 60);
    setStatus(`✅  ${km} km · ca. ${min} min`, 'ok');

  } catch (e) {
    setStatus('❌ ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

// Enter-Taste
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') getRoute();
});
</script>
</body>
</html>
